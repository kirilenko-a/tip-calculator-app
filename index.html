<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/favicon-32x32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
    <script type="module" src="/src/main.js"></script>
    <title>Tip calculator app</title>
  </head>
  <body class="font-main bg-grey-200 flex min-h-screen flex-col items-center">
    <header class="pt-12.5 pb-10">
      <img src="/images/logo.svg" alt="Splitter logo" />
    </header>

    <main class="w-full rounded-t-[25px] bg-white px-6 py-8.5">
      <form action="/" method="get" class="flex flex-col gap-8">
        <fieldset class="fieldset-flex">
          <label class="label" for="bill">Bill</label>
          <div class="input-wrapper before:bg-[url('/images/icon-dollar.svg')]">
            <input
              class="info-input"
              type="number"
              name="bill"
              id="bill"
              placeholder="0"
            />
          </div>
        </fieldset>

        <fieldset class="fieldset-flex">
          <label class="label" for="tip">Select Tip %</label>

          <ul class="grid grid-cols-2 gap-4" id="tip">
            <li>
              <button class="tip-button tip-btn-hover" type="button">5%</button>
            </li>
            <li>
              <button class="tip-button tip-btn-hover" type="button">
                10%
              </button>
            </li>
            <li>
              <button class="tip-button tip-btn-hover" type="button">
                15%
              </button>
            </li>
            <li>
              <button class="tip-button tip-btn-hover" type="button">
                25%
              </button>
            </li>
            <li>
              <button class="tip-button tip-btn-hover" type="button">
                50%
              </button>
            </li>
            <li>
              <input
                type="number"
                placeholder="Custom"
                class="custom-tip [&::-webkit-inner-spin-button]:appearance-none [&::-webkit-outer-spin-button]:appearance-none"
              />
            </li>
          </ul>
        </fieldset>

        <fieldset class="fieldset-flex">
          <label class="label" for="people-amount">Number of people</label>
          <div class="input-wrapper before:bg-[url('/images/icon-person.svg')]">
            <input
              class="info-input"
              type="number"
              name="people-amount"
              id="people-amount"
              placeholder="0"
            />
          </div>
        </fieldset>
      </form>
    </main>
  </body>
</html>
