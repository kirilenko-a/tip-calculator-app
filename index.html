<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/favicon-32x32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
    <script type="module" src="/src/main.js"></script>
    <title>Tip calculator app</title>
  </head>
  <body class="font-main bg-grey-200 flex min-h-screen flex-col items-center">
    <header class="pt-12.5 pb-10">
      <img src="/images/logo.svg" alt="Splitter logo" />
    </header>

    <main class="grid w-full gap-8 rounded-t-[25px] bg-white px-6 py-8.5">
      <form id="form" class="flex flex-col gap-8">
        <fieldset class="fieldset-flex">
          <label class="label" for="bill">Bill</label>
          <div class="input-wrapper before:bg-[url('/images/icon-dollar.svg')]">
            <input
              class="info-input"
              type="number"
              name="bill"
              id="bill"
              placeholder="0"
            />
          </div>
        </fieldset>

        <fieldset class="fieldset-flex">
          <legend class="label mb-2">Select Tip %</legend>

          <ul class="grid grid-cols-2 gap-4" id="tip">
            <li>
              <button
                class="tip-button tip-btn-hover"
                type="button"
                aria-pressed="false"
                value="5"
              >
                5%
              </button>
            </li>
            <li>
              <button
                class="tip-button tip-btn-hover"
                type="button"
                aria-pressed="false"
                value="10"
              >
                10%
              </button>
            </li>
            <li>
              <button
                class="tip-button tip-btn-hover"
                type="button"
                aria-pressed="false"
                value="15"
              >
                15%
              </button>
            </li>
            <li>
              <button
                class="tip-button tip-btn-hover"
                type="button"
                aria-pressed="false"
                value="25"
              >
                25%
              </button>
            </li>
            <li>
              <button
                class="tip-button tip-btn-hover"
                type="button"
                aria-pressed="false"
                value="50"
              >
                50%
              </button>
            </li>
            <li>
              <input
                type="number"
                name="custom"
                aria-label="Custom tip percentage"
                placeholder="Custom"
                class="custom-tip [&::-webkit-inner-spin-button]:appearance-none [&::-webkit-outer-spin-button]:appearance-none"
              />
            </li>
          </ul>
        </fieldset>

        <fieldset class="fieldset-flex">
          <label class="label" for="people-amount">Number of people</label>
          <div class="input-wrapper before:bg-[url('/images/icon-person.svg')]">
            <input
              class="info-input"
              type="number"
              name="people-amount"
              id="people-amount"
              placeholder="0"
            />
          </div>
        </fieldset>
      </form>

      <section
        class="flex flex-col gap-8 rounded-[15px] bg-green-900 px-5.75 py-[29.5px]"
      >
        <div class="flex flex-col gap-6">
          <div class="summary-wrapper">
            <p class="flex flex-col">
              <span class="text-amount-summary">Tip Amount</span>
              <span class="text-per-person">/ person</span>
            </p>
            <p class="amount-summary">$0.00</p>
          </div>

          <div class="summary-wrapper">
            <p class="flex flex-col">
              <span class="text-amount-summary">Total</span>
              <span class="text-per-person">/ person</span>
            </p>
            <p class="amount-summary">$0.00</p>
          </div>
        </div>

        <button
          type="reset"
          form="form"
          disabled
          class="bg-green-750 w-full cursor-not-allowed rounded-[5px] py-2.25 font-bold text-green-800"
        >
          RESET
        </button>
      </section>
    </main>
  </body>
</html>
